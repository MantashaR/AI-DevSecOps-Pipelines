name: AutoPatch
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  security-events: write
  models: read

jobs:
  scan-and-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Install scanners
        run: |
          pip install --quiet semgrep
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin v0.70.0

      - name: Run Semgrep
        run: semgrep --config p/security-audit --sarif --output semgrep.sarif target-app || true

      - name: Run Trivy filesystem scan
        run: trivy fs --format sarif --output trivy.sarif target-app || true

      - name: Run AutoPatch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python src/autopatch.py \
            --sarif semgrep.sarif trivy.sarif \
            --repo-root . \
            --target-root target-app \
            --llm github-models

      - name: Open fix PR if patches were applied
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git diff --quiet -- target-app; then
            BR="autopatch/${{ github.run_id }}"
            git config user.name "autopatch[bot]"
            git config user.email "autopatch@users.noreply.github.com"
            git checkout -b "$BR"
            git add target-app .autopatch
            git commit -m "fix: AutoPatch applied automated remediation"
            git push origin "$BR"
            gh pr create --base main --head "$BR" \
              --title "[AutoPatch] Automated security fixes" \
              --body  "Generated by AutoPatch run #${{ github.run_id }}. See \`.autopatch/history.json\` for the run summary."
          else
            echo "No patches applied — nothing to PR."
            git add .autopatch || true
            git diff --quiet --cached || (
              git config user.name "autopatch[bot]";
              git config user.email "autopatch@users.noreply.github.com";
              git commit -m "chore: update autopatch history";
              git push
            )
          fi

      - name: Upload scan artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autopatch-scans
          path: |
            semgrep.sarif
            trivy.sarif
            .autopatch/history.json
